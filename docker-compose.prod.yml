name: visual-search-production

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  frontend:
    build:
      context: ./visual-search-fe
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_ENABLE_MOCK: "false"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      QDRANT_URL: http://qdrant:6333
      AI_SERVICE_URL: http://ai_service:8001
      IMAGE_BASE_URL: https://${APP_DOMAIN}
      BACKEND_CORS_ORIGINS: '["https://${APP_DOMAIN}"]'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-System Admin}
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
        --workers ${BACKEND_WORKERS:-2}
    volumes:
      - image_data:/app/static/images
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ai_service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai_service:
    build:
      context: ./AI
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      QDRANT_URL: http://qdrant:6333
      AI_CPU_THREADS: ${AI_CPU_THREADS:-8}
      AI_INFERENCE_THREADS: ${AI_INFERENCE_THREADS:-4}
      MAX_INDEX_WORKERS: ${MAX_INDEX_WORKERS:-2}
      TORCH_NUM_INTEROP_THREADS: 1
      CLIP_IMAGE_BATCH_SIZE: 2
      CLIP_IMAGE_BATCH_WAIT_MS: 8
      OCR_RECOGNITION_BATCH_SIZE: 4
      OCR_MAX_CONCURRENT_INFERENCE: ${OCR_MAX_CONCURRENT_INFERENCE:-2}
      OCR_MAX_INPUT_DIMENSION: 1600
    command: uvicorn ai_service:app --host 0.0.0.0 --port 8001
    volumes:
      - image_data:/app/static/images
      - ai_huggingface_cache:/root/.cache/huggingface
      - ai_easyocr_cache:/root/.EasyOCR
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  caddy_data:
  caddy_config:
  image_data:
  ai_huggingface_cache:
  ai_easyocr_cache:
  postgres_data:
  qdrant_data:
